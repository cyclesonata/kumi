name: Kumi

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kumi:
    name: Kumi / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mcp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Build the independent bridge for no-config interoperability
        run: |
          npm ci --prefix apps/mcp-server
          npm run build --prefix apps/mcp-server
      - name: Credential-free tests (no Live or paid inference)
        run: npm test
        env:
          KUMI_TEST_BRIDGE: "1"
      - run: git diff --check
